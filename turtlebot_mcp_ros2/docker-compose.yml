services:

  # ── TurtleBot3 Gazebo simulation + Nav2 ─────────────────────────────────────
  # Build first:   make build_sim
  # GUI needs X11: run `xhost +local:docker` once per login session.
  turtlebot_sim:
    image: turtlebot3_sim:latest
    build:
      context: .
      dockerfile: docker/Dockerfile-sim
    container_name: turtlebot3-sim
    # Pinned amd64: Gazebo Classic has no arm64 packages upstream (see the
    # ARCH NOTE in docker/Dockerfile-sim). Run this service on a dev
    # workstation; the Pi5 runs hive_api + robotstore only.
    platform: linux/amd64

    # Host network is mandatory for ROS 2 DDS — same domain/vendor as
    # hive_api-api-arm and robotstore_cont-run-arm containers.
    network_mode: host

    tty: true
    stdin_open: true

    environment:
      - TURTLEBOT3_MODEL=burger
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=0
      # Robot spawn pose — Gazebo spawn AND AMCL initial pose both use this,
      # so RViz localization always matches the simulator.
      - SPAWN_X=-2.0
      - SPAWN_Y=-0.5
      - SPAWN_YAW=0.0
      # X11 GUI (gzclient + RViz render on the host display)
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1

    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

    # GPU acceleration for Gazebo/RViz rendering (Intel/AMD Mesa DRI).
    devices:
      - /dev/dri:/dev/dri

    # 'gui' (default) → Gazebo GUI + RViz | 'headless' → gzserver only, no RViz
    command: gui

    restart: unless-stopped

  # ── RPLIDAR ROS 2 driver ─────────────────────────────────────────────────────
  # Build first:   make build_rplidar
  # Multi-arch (amd64 + arm64) — runs equally well on a dev box or on the
  # Pi5 with the physical sensor attached. No platform pin needed.
  rplidar:
    image: rplidar_ros2:latest
    build:
      context: .
      dockerfile: docker/Dockerfile-rplidar
    container_name: rplidar-ros2

    # Host network for ROS 2 DDS — same domain/vendor as the other services.
    network_mode: host

    tty: true
    stdin_open: true

    environment:
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_DOMAIN_ID=0
      - RPLIDAR_MODEL=a1
      - RPLIDAR_PORT=/dev/ttyUSB0
      - RPLIDAR_BAUDRATE=115200
      - RPLIDAR_FRAME_ID=laser

    devices:
      - /dev/ttyUSB0:/dev/ttyUSB0

    command: run

    restart: unless-stopped
    # Lightweight driver node — this ceiling just stops it joining any
    # runaway-container pile-on with hive_api/robotstore on the Pi5.
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
