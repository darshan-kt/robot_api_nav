[pytest]
# Scoped deliberately to tests/ — turtlebot_mcp_ros2/ ships its own
# independent suite and .venv, and backend/{build,install}/ are colcon
# artifacts. Run the ROS-side bridge tests inside the robotstore container
# (see docs/TESTING.md), not from here: they need rclpy + hive_interfaces.
testpaths = tests
norecursedirs = .git node_modules .venv* turtlebot_mcp_ros2 backend/build backend/install dist map

asyncio_mode = auto
asyncio_default_fixture_loop_scope = function

markers =
    unit: pure-function tests, no I/O, no running stack
    integration: in-process FastAPI app wired to a fake MQTT client
    system: requires the live docker stack (gateway + broker + bridge)
    broker_only: needs only the MQTT broker, not the full stack (runs the gateway in-process)
    slow: takes tens of seconds — latency sweeps and similar; deselect with -m 'not slow'

filterwarnings =
    ignore::DeprecationWarning

addopts = -ra --strict-markers
