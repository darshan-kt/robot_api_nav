# Per-service `deploy.resources.limits` below are CPU/memory ceilings, sized
# for a Raspberry Pi 5 (4 cores / 8 GB): 0.5+0.5+0.5+2.5 = 4.0 vCPU and
# 256M+256M+512M+3072M = 4G total, leaving headroom for the host OS, Docker
# daemon, and any other services (e.g. turtlebot_mcp_ros2's rplidar). A
# per-container ceiling being individually generous while the sum exceeds 4
# is intentional — Linux's CFS scheduler still caps real usage to what's
# physically available, this just stops any ONE runaway container from
# starving everything else and hanging the whole board. Compose v2 applies
# these on plain `docker compose up`, no Swarm needed (Compose 2.35.1 here).
#
# NOTE on the MQTT split (2026 refactor): hive_api used to BE a ROS 2 node
# (rclpy + colcon build, network_mode: host, ROS_DOMAIN_ID/RMW pinning) —
# see git history if you need the old version. It's now a plain Python/
# FastAPI service that only speaks MQTT; all ROS 2 code lives in
# `robotstore` (hive_bt_server + bt_runner + the new hive_mqtt_bridge node).
# That's why hive_api dropped from 1.5 vCPU/768M to 0.5/256M — it no longer
# carries a ROS 2 workspace — freeing exactly the budget the new mqtt-broker
# service needs (0.5/512M), so the total ceiling is unchanged from before.
#
# NOTE on the WebRTC camera feed (same 2026 cycle): hive_camera_bridge is a
# SECOND boundary node alongside hive_mqtt_bridge, but for a reason MQTT
# doesn't apply to — live video is bulk, real-time media, not something a
# pub/sub message bus is built to carry. Signaling (the one-time SDP
# offer/answer handshake) is proxied through hive_api's /webrtc/offer, same
# single-entry-point rule as everything else the browser calls. The actual
# video (RTP) does NOT — it flows directly browser <-> hive_camera_bridge
# over an ICE-negotiated path once signaling completes, which is why
# hive_api needs a route to robotstore's host-networked port 8766 (see
# extra_hosts below) even though it never touches the video bytes itself.
services:

  # ── React frontend — production build served by nginx ───────────────────────
  # No source/node_modules bind mounts: the image is self-contained (static
  # assets baked in at build time), so there's nothing on the host to mount.
  # For local hot-reload development, run `npm run dev` directly instead of
  # through Docker.
  appstore:
    image: robot_appstore:${ARCH_TAG:-amd64}
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        # Baked into the static JS bundle at build time (Vite, not a runtime
        # env var — see docker/Dockerfile comment). Set VITE_GATEWAY_URL in
        # whichever env-file you build with (.env.aws for the AWS side) to
        # the address browsers will actually load the gateway API from —
        # e.g. http://<ec2-public-ip>:1717. Defaults to localhost, which is
        # only correct when the browser and hive_api run on the same host.
        VITE_GATEWAY_URL: ${VITE_GATEWAY_URL:-http://localhost:1717}
    # Suffixed -arm: this repo (appstore_arm) is commonly checked out
    # alongside sibling copies (e.g. appstore_amd) that use the same
    # docker-compose.yml — plain "robot_appstore" collides with theirs
    # since Docker container names are global on the host.
    container_name: robot_appstore-arm
    ports:
      - "5174:5174"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ── MQTT broker — the decoupling point between hive_api and ROS 2 ───────────
  # HiveMQ CE. Dev-mode auth: HIVEMQ_ALLOW_ALL_CLIENTS=true (anonymous, no
  # username/password) — acceptable ONLY because this stack runs on a
  # private robot/LAN network today. Before exposing the broker beyond that
  # (cloud backend, multi-operator), add the HiveMQ file-RBAC extension (or
  # switch to Mosquitto with a password_file) and TLS on 8883. Do not ship
  # this default to anything internet-reachable.
  mqtt-broker:
    image: hivemq/hivemq-ce:latest
    container_name: hive_mqtt_broker-arm
    environment:
      - HIVEMQ_ALLOW_ALL_CLIENTS=true
      # Remote JMX is on by default in the image's run.sh and tries to bind
      # an RMI connector using the container's own hostname — which doesn't
      # always resolve cleanly depending on the Docker network/DNS setup
      # (symptom: "MalformedURLException: Unable to resolve hostname" and
      # the container crash-loops). We don't use remote JMX monitoring here,
      # so just disable it instead of chasing container DNS.
      - HIVEMQ_JMX_ENABLED=false
    ports:
      - "1883:1883"   # MQTT — published to the host so robotstore (host
                       # network) reaches it at localhost:1883, same as
                       # hive_api reaches it at mqtt-broker:1883 over the
                       # compose network.
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # ── FastAPI gateway (backend/hive_api_gateway) ───────────────────────────────
  # Plain Python service — NO ROS 2, NO colcon. Talks to the robot only via
  # MQTT (mqtt-broker) plus the local map.pgm file mount. Runs on the default
  # compose bridge network (host networking is no longer needed — that
  # requirement was purely a ROS 2 DDS discovery constraint).
  hive_api:
    image: hive_api:${ARCH_TAG:-amd64}
    build:
      context: ./backend/hive_api_gateway
      dockerfile: Dockerfile
    # Suffixed -arm: avoids colliding with sibling checkouts (see appstore
    # note above).
    container_name: hive_api-api-arm

    ports:
      - "1717:1717"

    tty: true
    stdin_open: true

    environment:
      # mqtt-broker is always co-located with hive_api (local single-host
      # dev AND the AWS split both run them on the same machine) — this
      # never needs to be an internet address, so unlike robotstore's
      # MQTT_HOST below, it's not parameterized.
      - MQTT_HOST=mqtt-broker
      - MQTT_PORT=1883
      # Only needed once the broker actually enforces auth (see README's
      # AWS section) — empty/unset means anonymous, matching today's
      # HIVEMQ_ALLOW_ALL_CLIENTS dev-mode default below.
      - MQTT_USERNAME=${MQTT_USERNAME:-}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-}
      - ROBOT_ID=${ROBOT_ID:-robot-1}
      - ROBOT_MAP_DIR=/robot_map   # map.pgm served by GET /api/map
      # Wide open by default — fine on this private LAN setup, wrong the
      # moment hive_api is reachable from the public internet. Set to the
      # real frontend origin(s) when deploying (see README's AWS section).
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-*}
      # WebRTC signaling (POST /webrtc/offer) rides the MQTT connection
      # above now — cmd/webrtc_offer -> webrtc/answer, same path as every
      # other robot-bound command (see mqtt_client.publish_webrtc_offer).
      # No direct HTTP address to hive_camera_bridge is needed here
      # anymore; that's what let this stop needing host.docker.internal.

    volumes:
      # Source bind-mounted over the image's baked-in copy — Python changes
      # hot-apply on `docker restart hive_api-api-arm`, no rebuild needed
      # (same dev convenience the old ROS gateway had, just without colcon).
      - ./backend/hive_api_gateway/app:/app/app
      # Operational map (read-only) — served by GET /api/map
      - ./map:/robot_map:ro

    depends_on:
      - mqtt-broker

    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # ── RobotStore: hive_bt_server + bt_runner + hive_mqtt_bridge +
  #    hive_camera_bridge (backend/) ─────────────────────────────────────────
  # Pre-build image + workspace first:  make build_robotstore
  # hive_mqtt_bridge is the ROS2↔MQTT translation point; hive_camera_bridge
  # is the ROS2↔WebRTC one — the only two nodes in this container that know
  # anything exists outside ROS 2.
  robotstore:
    image: robotstore_image:${ARCH_TAG:-amd64}
    # Suffixed -arm: avoids colliding with sibling checkouts (see appstore
    # note above).
    container_name: robotstore_cont-run-arm

    # Host network mandatory for DDS; privileged for hardware/serial access
    network_mode: host
    privileged: true

    tty: true
    stdin_open: true

    environment:
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=file:///home/charlie/ros2_ws/cyclonedds.xml
      - BUILD_BASE=/home/charlie/ros2_ws/build
      - INSTALL_BASE=/home/charlie/ros2_ws/install
      - LOG_BASE=/home/charlie/ros2_ws/log
      # hive_mqtt_bridge → broker. Defaults match local single-host dev
      # (host networking means "localhost" reaches the mqtt-broker container
      # via its host-published port, see above). For the AWS split, override
      # ROBOT_MQTT_HOST/PORT to the AWS broker's public address instead —
      # see Makefile.aws's run_robot target and README's AWS section. Kept
      # as a DIFFERENT variable name than hive_api's hardcoded MQTT_HOST
      # above on purpose: hive_api's broker is always local, robotstore's
      # might not be, and conflating the two names invites exactly the kind
      # of "which one did I just override" mistake this avoids.
      - MQTT_HOST=${ROBOT_MQTT_HOST:-localhost}
      - MQTT_PORT=${ROBOT_MQTT_PORT:-1883}
      - MQTT_USERNAME=${MQTT_USERNAME:-}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-}
      - ROBOT_ID=${ROBOT_ID:-robot-1}
      # hive_camera_bridge — RGB topic from the turtlebot3_burger_cam model
      # (see turtlebot_mcp_ros2/docker-compose.yml). Signaling on :8766 is
      # reachable at the host's own IP because of network_mode: host, same
      # as mqtt-broker's published 1883 — no separate 'ports:' entry needed.
      - CAMERA_TOPIC=/image_raw
      - CAMERA_SIGNALING_PORT=8766
      - CAMERA_FPS=10

    volumes:
      # ROS 2 package sources
      - ./backend/bt_runner:/home/charlie/ros2_ws/src/bt_runner
      - ./backend/hive_bt_server:/home/charlie/ros2_ws/src/hive_bt_server
      - ./backend/hive_interfaces:/home/charlie/ros2_ws/src/hive_interfaces
      - ./backend/hive_mqtt_bridge:/home/charlie/ros2_ws/src/hive_mqtt_bridge
      - ./backend/hive_camera_bridge:/home/charlie/ros2_ws/src/hive_camera_bridge
      # CycloneDDS config
      - ./backend/cyclonedds.xml:/home/charlie/ros2_ws/cyclonedds.xml
      # Entrypoint + docker helpers
      - ./backend/docker:/home/charlie/ros2_ws/docker
      - ./backend/docker/dev/entrypoint_robotstore.sh:/home/charlie/ros2_ws/entrypoint_robotstore.sh
      # colcon build artifacts (pre-built — skip rebuilding every start)
      - ./backend/build:/home/charlie/ros2_ws/build
      - ./backend/install:/home/charlie/ros2_ws/install
      - ./backend/log:/home/charlie/ros2_ws/log

    # Entrypoint sources the workspace and runs:
    #   ros2 launch bt_runner hive_server_runner.launch.py
    # (which now also includes hive_mqtt_bridge + hive_camera_bridge —
    # see that launch file)
    command: bash /home/charlie/ros2_ws/entrypoint_robotstore.sh

    depends_on:
      - mqtt-broker

    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.5"
          memory: 3072M
